[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-provider-fxmacrodata"
version = "0.1.0"
description = "Apache Airflow provider for FXMacroData: official macroeconomic, FX and central-bank data for 18 currencies, with a sensor that waits for a release to actually land."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "FXMacroData", email = "info@fxmacrodata.com" }]
keywords = [
    "airflow",
    "airflow-provider",
    "macroeconomic",
    "forex",
    "fx",
    "central bank",
    "economic calendar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["apache-airflow>=2.7.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://fxmacrodata.com/?utm_source=pypi&utm_medium=referral&utm_campaign=airflow-provider-fxmacrodata&utm_content=homepage"
Documentation = "https://fxmacrodata.com/documentation?utm_source=pypi&utm_medium=referral&utm_campaign=airflow-provider-fxmacrodata&utm_content=docs"
Source = "https://github.com/fxmacrodata/airflow-provider-fxmacrodata"

# How Airflow discovers this provider. Airflow reads this entry point at startup
# and registers the connection type, hook, operators and sensor.
[project.entry-points.apache_airflow_provider]
provider_info = "fxmacrodata_provider.get_provider_info:get_provider_info"

[tool.hatch.build.targets.sdist]
include = ["fxmacrodata_provider/", "README.md", "LICENSE", "example_dags/", "tests/"]

[tool.hatch.build.targets.wheel]
include = ["fxmacrodata_provider/"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv-af", ".venv"]

[tool.ruff.lint]
# S (bandit) is on deliberately: this package makes outbound HTTP with an
# operator-supplied base URL, so the URL-scheme audit is a rule we want.
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF", "DTZ", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert on private state and use assert.
"tests/*" = ["S101", "SLF001", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
